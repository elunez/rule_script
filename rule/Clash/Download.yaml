  # 参考：https://devblogs.microsoft.com/dotnet/critical-dotnet-install-links-are-changing/
  - DOMAIN,download.visualstudio.microsoft.com
  - DOMAIN,download.visualstudio.com
  - DOMAIN,builds.dotnet.microsoft.com

