  # 下载服务：由 rule/Surge/Download.list 转换，策略由 clash.yaml 指定。
  # GitHub：githubusercontent.com 也包含头像、原始文件等非下载内容。
  - DOMAIN-SUFFIX,githubusercontent.com
  - DOMAIN,codeload.github.com
  - DOMAIN,github-cloud.s3.amazonaws.com
  - DOMAIN,ghcr.io

  # Microsoft：软件、Windows Update 与 Microsoft 365 更新。
  - DOMAIN,download.microsoft.com
  - DOMAIN,software-download.microsoft.com
  - DOMAIN-SUFFIX,download.windowsupdate.com
  - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com
  - DOMAIN-SUFFIX,officecdn.microsoft.com

